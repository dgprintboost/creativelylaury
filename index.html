<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SALL Amina Laury — Creatively Laury</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body class="font-sans bg-cream min-h-[100svh] flex items-center justify-center p-4">

  <main class="bg-white/70 backdrop-blur-[20px] shadow-[0_40px_100px_rgba(139,105,86,0.22)] w-full max-w-[480px] h-full min-h-[750px] rounded-[35px] border border-rosegold/30 p-5 flex flex-col relative overflow-hidden">

    <!-- Halo décoratif -->
    <div class="pointer-events-none absolute -top-24 -right-20 w-64 h-64 rounded-full bg-rosegold/20 blur-3xl"></div>
    <div class="pointer-events-none absolute -bottom-28 -left-24 w-72 h-72 rounded-full bg-[#E2C7B2]/40 blur-3xl"></div>

    <div class="relative flex justify-end mb-1 animate-fade-in-up">
      <div class="relative">
        <select id="languageSelect" aria-label="Langue" class="appearance-none bg-white/80 border border-rosegold/40 text-cocoa text-xs font-bold rounded-full py-1.5 px-4 pr-8 cursor-pointer focus:outline-none focus:border-rosegold transition-colors">
          <option value="fr">🇫🇷</option>
          <option value="en">🇬🇧</option>
          <option value="es">🇪🇸</option>
          <option value="de">🇩🇪</option>
          <option value="it">🇮🇹</option>
          <option value="ar">🇸🇦</option>
          <option value="pt">🇵🇹</option>
          <option value="nl">🇳🇱</option>
          <option value="ru">🇷🇺</option>
          <option value="zh">🇨🇳</option>
          <option value="ja">🇯🇵</option>
          <option value="tr">🇹🇷</option>
        </select>
        <div class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] pointer-events-none opacity-50 text-cocoa">▼</div>
      </div>
    </div>

    <!-- Identité -->
    <div class="relative flex flex-col items-center mb-5">
      <!-- PHOTO DE PROFIL : remplacer photo-profil.jpg par la vraie photo (format carré conseillé) -->
      <div class="w-24 h-24 rounded-full bg-white border border-rosegold/50 p-1 shadow-[0_10px_30px_rgba(201,160,138,0.45)] mb-4 overflow-hidden animate-fade-in-up">
        <img src="./photo-profil.jpg" alt="SALL Amina Laury" class="w-full h-full object-cover rounded-full">
      </div>

      <h1 class="text-center font-display text-4xl font-semibold tracking-tight text-cocoa leading-none mb-1 animate-fade-in-up [animation-delay:0.1s]" data-i18n-html="title_html"></h1>
      <p class="text-[11px] font-bold uppercase tracking-[0.28em] text-rosegold mb-3 animate-fade-in-up [animation-delay:0.15s]">@creativelylaury</p>

      <div class="bg-rosegold/10 border border-rosegold/35 px-4 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-widest text-mocha animate-fade-in-up [animation-delay:0.2s]" data-i18n="top_meta"></div>

      <p class="text-center text-[13px] leading-relaxed text-mocha mt-4 px-3 animate-fade-in-up [animation-delay:0.25s]" data-i18n="tagline"></p>
    </div>

    <!-- Accroche -->
    <div class="relative bg-white/60 border border-rosegold/25 rounded-2xl px-4 py-3 mb-4 animate-fade-in-up [animation-delay:0.3s]">
      <p class="font-display italic text-[15px] leading-snug text-cocoa text-center" data-i18n="quote"></p>
    </div>

    <!-- Liens -->
    <div class="relative flex-grow flex flex-col justify-center gap-2.5 mb-6">

      <a href="https://www.instagram.com/creativelylaury" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between bg-white/80 border border-rosegold/25 rounded-2xl p-2.5 shadow-[0_8px_20px_rgba(139,105,86,0.10)] hover:-translate-y-1 hover:border-rosegold/60 transition-all animate-fade-in-up [animation-delay:0.3s]">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center bg-gradient-to-br from-[#F9CE63] via-[#E1568A] to-[#8E4BC4] text-white shadow-inner">
            <i class="fa-brands fa-instagram text-lg"></i>
          </div>
          <div class="flex flex-col">
            <strong class="text-sm text-cocoa" data-i18n="ig_title"></strong>
            <span class="text-[11px] text-mocha font-medium" data-i18n="ig_desc"></span>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-rosegold/50 text-xs pr-2"></i>
      </a>

      <a href="https://www.tiktok.com/@creativelylaury" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between bg-white/80 border border-rosegold/25 rounded-2xl p-2.5 shadow-[0_8px_20px_rgba(139,105,86,0.10)] hover:-translate-y-1 hover:border-rosegold/60 transition-all animate-fade-in-up [animation-delay:0.35s]">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center bg-cocoa text-white shadow-inner">
            <i class="fa-brands fa-tiktok text-lg"></i>
          </div>
          <div class="flex flex-col">
            <strong class="text-sm text-cocoa" data-i18n="tt_title"></strong>
            <span class="text-[11px] text-mocha font-medium" data-i18n="tt_desc"></span>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-rosegold/50 text-xs pr-2"></i>
      </a>

      <a href="https://wa.me/message/EKCPHTIRWVYTO1" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between bg-white/80 border border-rosegold/25 rounded-2xl p-2.5 shadow-[0_8px_20px_rgba(139,105,86,0.10)] hover:-translate-y-1 hover:border-rosegold/60 transition-all animate-fade-in-up [animation-delay:0.4s]">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center bg-[#25D366] text-white shadow-inner">
            <i class="fa-brands fa-whatsapp text-lg"></i>
          </div>
          <div class="flex flex-col">
            <strong class="text-sm text-cocoa" data-i18n="wa_title"></strong>
            <span class="text-[11px] text-mocha font-medium" data-i18n="wa_desc"></span>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-rosegold/50 text-xs pr-2"></i>
      </a>

      <a href="mailto:contact@creativelylaury.com" class="flex items-center justify-between bg-white/80 border border-rosegold/25 rounded-2xl p-2.5 shadow-[0_8px_20px_rgba(139,105,86,0.10)] hover:-translate-y-1 hover:border-rosegold/60 transition-all animate-fade-in-up [animation-delay:0.45s]">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center bg-rosegold text-white shadow-inner">
            <i class="fa-solid fa-envelope text-lg"></i>
          </div>
          <div class="flex flex-col">
            <strong class="text-sm text-cocoa" data-i18n="mail_title"></strong>
            <span class="text-[11px] text-mocha font-medium">contact@creativelylaury.com</span>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-rosegold/50 text-xs pr-2"></i>
      </a>

    </div>

    <!-- Raccourcis -->
    <div class="relative flex items-center justify-center gap-3 mb-6 animate-fade-in-up [animation-delay:0.5s]">
      <a href="https://www.instagram.com/creativelylaury" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="w-10 h-10 bg-white/80 border border-rosegold/35 rounded-full flex items-center justify-center text-mocha hover:text-rosegold hover:-translate-y-1 transition-all"><i class="fa-brands fa-instagram text-lg"></i></a>
      <a href="https://www.tiktok.com/@creativelylaury" target="_blank" rel="noopener noreferrer" aria-label="TikTok" class="w-10 h-10 bg-white/80 border border-rosegold/35 rounded-full flex items-center justify-center text-mocha hover:text-rosegold hover:-translate-y-1 transition-all"><i class="fa-brands fa-tiktok text-lg"></i></a>
      <a href="https://wa.me/message/EKCPHTIRWVYTO1" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" class="w-10 h-10 bg-white/80 border border-rosegold/35 rounded-full flex items-center justify-center text-mocha hover:text-rosegold hover:-translate-y-1 transition-all"><i class="fa-brands fa-whatsapp text-lg"></i></a>
      <a href="mailto:contact@creativelylaury.com" aria-label="Email" class="w-10 h-10 bg-white/80 border border-rosegold/35 rounded-full flex items-center justify-center text-mocha hover:text-rosegold hover:-translate-y-1 transition-all"><i class="fa-solid fa-envelope text-lg"></i></a>
    </div>

    <div class="relative grid grid-cols-2 gap-3 pt-6 border-t border-rosegold/25 animate-fade-in-up [animation-delay:0.5s]">
      <button id="saveBtn" class="bg-cocoa text-cream border border-cocoa rounded-xl py-3 text-xs font-black uppercase flex items-center justify-center gap-2 shadow-lg hover:-translate-y-1 transition-all active:scale-95">
        <i class="fa-regular fa-address-card"></i> <span data-i18n="save"></span>
      </button>
      <button id="shareBtn" class="bg-white/80 text-cocoa border border-rosegold/40 rounded-xl py-3 text-xs font-black uppercase flex items-center justify-center gap-2 shadow-lg hover:-translate-y-1 transition-all active:scale-95">
        <i class="fa-solid fa-share-nodes"></i> <span data-i18n="share"></span>
      </button>
    </div>

    <div class="relative text-center mt-6 opacity-50 text-[9px] font-bold uppercase tracking-widest text-mocha animate-fade-in-up [animation-delay:0.5s]" data-i18n="mini_note"></div>

  </main>

  <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-cocoa text-cream text-xs font-bold px-6 py-2.5 rounded-full opacity-0 pointer-events-none transition-all duration-300 translate-y-4 z-50"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
